openapi: 3.0.3
info:
  title: TaradomeMusik Platform API
  version: 1.0.0
  description: Production-grade API spec (schema-complete baseline) for TaradomeMusik website + CRM + ledger + sponsorships + artist landing pages.

servers:
  - url: http://localhost:3001/v1
  - url: https://api.taradomemusik.com/v1

security:
  -
    bearerAuth:

tags:
  -
    name: Auth
  -
    name: Artists
  -
    name: Releases
  -
    name: Tracks
  -
    name: Media
  -
    name: LandingPages
  -
    name: Spotlight
  -
    name: CRM
  -
    name: Events
  -
    name: Subscriptions
  -
    name: Payments
  -
    name: Partners
  -
    name: Sponsorships
  -
    name: Ledger
  -
    name: Royalties
  -
    name: Analytics
  -
    name: Admin
  -
    name: Webhooks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UUID:
      type: string
      format: uuid
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Artist:
      type: object
      required:
        - name
        - slug
      properties:
        id:
          $ref: #/components/schemas/UUID
        orgId:
          $ref: #/components/schemas/UUID
        name:
          type: string
        slug:
          type: string
        bio:
          type: string
        origin:
          type: string
        genre:
          type: string
        imageUrl:
          type: string
        socials:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - active
            - paused
            - archived
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Release:
      type: object
      required:
        - artistId
        - title
        - type
        - releaseDate
      properties:
        id:
          $ref: #/components/schemas/UUID
        artistId:
          $ref: #/components/schemas/UUID
        title:
          type: string
        type:
          type: string
          enum:
            - single
            - ep
            - album
        releaseDate:
          type: string
          format: date
        coverUrl:
          type: string
        upc:
          type: string
        status:
          type: string
          enum:
            - draft
            - scheduled
            - live
            - archived
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Track:
      type: object
      required:
        - releaseId
        - artistId
        - title
      properties:
        id:
          $ref: #/components/schemas/UUID
        releaseId:
          $ref: #/components/schemas/UUID
        artistId:
          $ref: #/components/schemas/UUID
        title:
          type: string
        isrc:
          type: string
        durationMs:
          type: integer
        explicit:
          type: boolean
        previewAssetId:
          $ref: #/components/schemas/UUID
        audioAssetId:
          $ref: #/components/schemas/UUID
        status:
          type: string
          enum:
            - draft
            - live
            - archived
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Fan:
      type: object
      properties:
        id:
          $ref: #/components/schemas/UUID
        email:
          type: string
          format: email
        phone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        city:
          type: string
        region:
          type: string
        country:
          type: string
        consentEmail:
          type: boolean
        consentSms:
          type: boolean
        tags:
          type: array
          items:
            type: string
        traits:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Partner:
      type: object
      properties:
        id:
          $ref: #/components/schemas/UUID
        name:
          type: string
        type:
          type: string
          enum:
            - sponsor
            - brand
            - distributor
            - media
            - venue
            - other
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LandingPage:
      type: object
      properties:
        id:
          $ref: #/components/schemas/UUID
        type:
          type: string
          enum:
            - artist
            - release
            - spotlight
            - sponsor
            - partnership
            - campaign
        slug:
          type: string
        title:
          type: string
        artistId:
          $ref: #/components/schemas/UUID
        releaseId:
          $ref: #/components/schemas/UUID
        partnerId:
          $ref: #/components/schemas/UUID
        content:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LedgerEntryCreate:
      type: object
      required:
        - postedAt
        - currency
        - lines
      properties:
        postedAt:
          type: string
          format: date-time
        memo:
          type: string
        currency:
          type: string
        sourceType:
          type: string
        sourceId:
          $ref: #/components/schemas/UUID
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required:
              - accountCode
            properties:
              accountCode:
                type: string
              debitCents:
                type: integer
              creditCents:
                type: integer
              artistId:
                $ref: #/components/schemas/UUID
              partnerId:
                $ref: #/components/schemas/UUID
              department:
                type: string
              metadata:
                type: object
                additionalProperties: true
    RoyaltyStatement:
      type: object
      properties:
        id:
          $ref: #/components/schemas/UUID
        artistId:
          $ref: #/components/schemas/UUID
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        grossCents:
          type: integer
        netCents:
          type: integer
        recoupedCents:
          type: integer
        payableCents:
          type: integer
        status:
          type: string
          enum:
            - draft
            - issued
            - paid
        createdAt:
          type: string
          format: date-time
paths:
  /auth/login:
    post:
      tags:
        - Auth
      security:

      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Error
  /auth/refresh:
    post:
      tags:
        - Auth
      security:

      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke refresh token
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /auth/me:
    get:
      tags:
        - Auth
      summary: Current user profile
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: #/components/schemas/UUID
                  email:
                    type: string
                  role:
                    type: string
  /artists:
    get:
      tags:
        - Artists
      summary: List artists
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Artist
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - Artists
      summary: Create Artist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Artist
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Artist
  /artists/{artistId}:
    get:
      tags:
        - Artists
      summary: Get Artist
      parameters:
        -
          in: path
          name: artistId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Artist
    put:
      tags:
        - Artists
      summary: Update Artist
      parameters:
        -
          in: path
          name: artistId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Artist
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Artist
    delete:
      tags:
        - Artists
      summary: Delete Artist (soft-delete)
      parameters:
        -
          in: path
          name: artistId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /releases:
    get:
      tags:
        - Releases
      summary: List releases
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Release
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - Releases
      summary: Create Release
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Release
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Release
  /releases/{releaseId}:
    get:
      tags:
        - Releases
      summary: Get Release
      parameters:
        -
          in: path
          name: releaseId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Release
    put:
      tags:
        - Releases
      summary: Update Release
      parameters:
        -
          in: path
          name: releaseId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Release
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Release
    delete:
      tags:
        - Releases
      summary: Delete Release (soft-delete)
      parameters:
        -
          in: path
          name: releaseId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /tracks:
    get:
      tags:
        - Tracks
      summary: List tracks
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Track
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - Tracks
      summary: Create Track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Track
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Track
  /tracks/{trackId}:
    get:
      tags:
        - Tracks
      summary: Get Track
      parameters:
        -
          in: path
          name: trackId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Track
    put:
      tags:
        - Tracks
      summary: Update Track
      parameters:
        -
          in: path
          name: trackId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Track
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Track
    delete:
      tags:
        - Tracks
      summary: Delete Track (soft-delete)
      parameters:
        -
          in: path
          name: trackId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /fans:
    get:
      tags:
        - Fans
      summary: List fans
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Fan
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - Fans
      summary: Create Fan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Fan
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Fan
  /fans/{fanId}:
    get:
      tags:
        - Fans
      summary: Get Fan
      parameters:
        -
          in: path
          name: fanId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Fan
    put:
      tags:
        - Fans
      summary: Update Fan
      parameters:
        -
          in: path
          name: fanId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Fan
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Fan
    delete:
      tags:
        - Fans
      summary: Delete Fan (soft-delete)
      parameters:
        -
          in: path
          name: fanId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /partners:
    get:
      tags:
        - Partners
      summary: List partners
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Partner
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - Partners
      summary: Create Partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Partner
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Partner
  /partners/{partnerId}:
    get:
      tags:
        - Partners
      summary: Get Partner
      parameters:
        -
          in: path
          name: partnerId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Partner
    put:
      tags:
        - Partners
      summary: Update Partner
      parameters:
        -
          in: path
          name: partnerId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/Partner
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/Partner
    delete:
      tags:
        - Partners
      summary: Delete Partner (soft-delete)
      parameters:
        -
          in: path
          name: partnerId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /landing-pages:
    get:
      tags:
        - LandingPages
      summary: List landing-pages
      parameters:
        -
          in: query
          name: limit
          schema:
            type: integer
            default: 50
        -
          in: query
          name: offset
          schema:
            type: integer
            default: 0
        -
          in: query
          name: q
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/LandingPage
                  meta:
                    $ref: #/components/schemas/PageMeta
    post:
      tags:
        - LandingPages
      summary: Create LandingPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/LandingPage
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: #/components/schemas/LandingPage
  /landing-pages/{pageId}:
    get:
      tags:
        - LandingPages
      summary: Get LandingPage
      parameters:
        -
          in: path
          name: pageId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/LandingPage
    put:
      tags:
        - LandingPages
      summary: Update LandingPage
      parameters:
        -
          in: path
          name: pageId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: #/components/schemas/LandingPage
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: #/components/schemas/LandingPage
    delete:
      tags:
        - LandingPages
      summary: Delete LandingPage (soft-delete)
      parameters:
        -
          in: path
          name: pageId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /crm/subscribe:
    post:
      tags:
        - CRM
      security:

      summary: Public fan signup (CRM ingest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - source
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                source:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                consentEmail:
                  type: boolean
                  default: true
                consentSms:
                  type: boolean
                  default: false
                utm:
                  type: object
                  additionalProperties: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fanId:
                    $ref: #/components/schemas/UUID
  /crm/fans/{fanId}/tags:
    post:
      tags:
        - CRM
      summary: Add tags to fan
      parameters:
        -
          in: path
          name: fanId
          required: true
          schema:
            $ref: #/components/schemas/UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /crm/segments:
    post:
      tags:
        - CRM
      summary: Create segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - rule
              properties:
                name:
                  type: string
                rule:
                  type: object
